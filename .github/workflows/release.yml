name: build and upload release

on:
  push:
    branches: [main, feature/ota-updates-ci]
  workflow_dispatch:

env:
  APP_KEY: viva_la_resistance
  UPDATES_URL: https://updates.905911.ru:8450
  FLUTTER_VERSION: '3.50.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload to updates server
        env:
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK" >&2
            exit 1
          fi
          echo "Uploading $APK ..."
          curl -fsS -X POST "${UPDATES_URL}/api/v1/apps/${APP_KEY}/releases" \
            -H "Authorization: Bearer ${UPDATES_TOKEN}" \
            -F "file=@${APK}" \
            -F "channel=stable" \
            -F "platform=android" \
            -F "arch=universal" \
            -F "releaseNotes=Auto build from main (${GITHUB_SHA::7})" \
            -F "mandatory=false"
